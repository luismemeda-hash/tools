<script>
(function () {
  var target = "https://8001-agqzl4enz346habtubgbzvisje.instabox.tech";
  var path = window.location.pathname;
  // 在 <用户名>.github.io/<仓库名>/ 下访问时，去掉第一段仓库名；
  // 用自己域名访问时，路径原样保留（/files、/todos 等都能跳对）。
  if (window.location.hostname.endsWith(".github.io")) {
    var parts = path.split("/").filter(Boolean);
    path = parts.length > 1 ? "/" + parts.slice(1).join("/") : "/";
  }
  window.location.replace(target + path + window.location.search);
})();
</script>
